<!doctype html>
<html>
<head>
    <title>Project Hunter</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Project Hunter</h2>
                <p>Sales Intelligence</p>
            </div>
            <nav>
                <a class="nav-link{% if active_page == 'dashboard' %} active{% endif %}" href="{{ url_for('home') }}">Dashboard</a>
                <a class="nav-link{% if active_page == 'projects' %} active{% endif %}" href="{{ url_for('projects_page') }}">Projects</a>
                <a class="nav-link{% if active_page == 'discover' %} active{% endif %}" href="{{ url_for('discover_projects_page') }}">Opportunity Finder</a>
                <a class="nav-link{% if active_page == 'companies' %} active{% endif %}" href="{{ url_for('companies_page') }}">Companies</a>
                <a class="nav-link{% if active_page == 'accounts' %} active{% endif %}" href="{{ url_for('accounts_page') }}">Accounts</a>
                <a class="nav-link{% if active_page == 'contacts' %} active{% endif %}" href="{{ url_for('contacts_page') }}">Contacts</a>
                <a class="nav-link{% if active_page == 'tasks' %} active{% endif %}" href="{{ url_for('tasks_page') }}">Tasks</a>
            </nav>
        </aside>

        <div class="content-area">
            <header class="page-header">
                <h1>Project Hunter</h1>
                <p>Power Plastics Sales Intelligence</p>
            </header>

            <main>
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
</body>
</html>
